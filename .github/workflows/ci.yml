name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: "build, vet, and test"
    runs-on: ubuntu-latest
    steps:
      - name: "Check out code"
        uses: actions/checkout@v4

      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: "Download dependencies"
        run: go mod download

      - name: "Build"
        run: go build ./...

      - name: "Vet"
        run: go vet ./...

      - name: "Test (offline, no Docker/DB required)"
        run: go test -race -count=1 ./...

      - name: "Verify integration-tagged files compile"
        run: go vet -tags=integration ./...

  docker:
    name: "docker build (image only, not required for tests)"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: "Check out code"
        uses: actions/checkout@v4

      - name: "Build image"
        run: docker build -t streamledger:ci .
